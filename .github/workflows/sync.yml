name: MIS Dashboard Sync

on:
  workflow_dispatch:
    inputs:
      month_folder:
        description: "This month's SharePoint folder name (e.g. Jul'26)"
        required: true
      prev_month_folder:
        description: "Previous month's folder name (e.g. Jun'26)"
        required: true
  repository_dispatch:
    types: [sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Work out the month ids
        id: m
        env:
          MF: ${{ github.event.inputs.month_folder || github.event.client_payload.month_folder }}
          PF: ${{ github.event.inputs.prev_month_folder || github.event.client_payload.prev_month_folder }}
        run: |
          echo "month_folder=$MF" >> "$GITHUB_OUTPUT"
          echo "month=$(echo "$MF" | cut -c1-3 | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "prev=$(echo "$PF" | cut -c1-3 | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download this month's files from SharePoint
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_BASE: ${{ secrets.SHAREPOINT_BASE }}
          MF: ${{ steps.m.outputs.month_folder }}
        run: python fetch_sharepoint.py --out ./month_files --month-folder "$MF"

      - name: Run the pipeline and publish to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_connect/run_pipeline.py \
            --month "${{ steps.m.outputs.month }}" \
            --prev-month "${{ steps.m.outputs.prev }}" \
            --files-dir ./month_files
